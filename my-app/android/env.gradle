def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def localEnv = new Properties()
[".env", ".env.local"].each { envFileName ->
    def envFile = file("$projectRoot/$envFileName")
    if (envFile.exists()) {
        envFile.withInputStream { localEnv.load(it) }
    }
}

ext.envValue = { name -> System.getenv(name) ?: localEnv.getProperty(name, "") }
ext.buildConfigString = { value -> "\"${String.valueOf(value).replace('\\', '\\\\').replace('"', '\\"')}\"" }